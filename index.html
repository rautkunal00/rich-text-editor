  <p>HTML Output</p>
  <div id="displayHTML"></div>

  <script type="module">
    import { initTiptapEditor } from './src/index.ts';

    const editorAPI = initTiptapEditor({
      selector: '#editor',
      editorConfig: {
        disabled: false,
        showMenu: false,
        showToolbar: true,
        displayWordCount: true,
        footerMessage: 'Malicious content in code will be automatically removed.',
        cssFiles: '',
        resize: true,
        height:'250px'
      }
    });

    editorAPI.onUpdate((editor) => {
      document.getElementById('displayHTML').innerText = editor.getHTML();
    });

  </script>
